<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img src="../icons/icon.svg" alt="" width="20" height="20" />
    <h1>Zen Cleaner</h1>
  </header>

  <label class="row toggle-row">
    <span>Nettoyage automatique</span>
    <input type="checkbox" id="enabled" class="switch" />
  </label>

  <p class="hint" id="threshold-hint"></p>

  <button id="clean-now">Nettoyer maintenant</button>

  <div class="row" id="last-cleanup" hidden>
    <span id="last-cleanup-label"></span>
    <button id="restore" class="link-button">Restaurer</button>
  </div>

  <footer>
    <button id="open-options" class="link-button">Réglages…</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
